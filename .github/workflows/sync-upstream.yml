name: Sync upstream and build

# Keeps this fork current with DroidDeck and publishes an APK.
#
# The fork's whole footprint on upstream is ~16 lines, so `git rebase` replays it
# cleanly. On a conflict the branch is left untouched and an issue is opened —
# a broken auto-merge must never ship a bad build.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Sync with upstream
    runs-on: ubuntu-24.04
    outputs:
      pushed: ${{ steps.pushing.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom-store
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "custom-store bot"
          git config user.email "bot@users.noreply.github.com"
          git remote add upstream https://github.com/Droid-Deck/DroidDeck.git

      - name: Fetch upstream
        id: fetch
        run: |
          set -euo pipefail
          git fetch upstream main
          NEW=$(git rev-parse upstream/main)
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$NEW" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase onto upstream
        id: rebase
        if: steps.fetch.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if git rebase --empty=drop upstream/main; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt || true
            git rebase --abort || true
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue on conflict
        if: steps.rebase.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=$(cat /tmp/conflicts.txt 2>/dev/null || echo '(none reported)')
          gh issue create \
            --title "Upstream sync conflict $(date -u +%Y-%m-%d)" \
            --body "Upstream moved to \`${{ steps.fetch.outputs.new }}\` and the rebase did not apply cleanly.

          The branch was left untouched, so nothing broken was pushed.

          Conflicting files:
          \`\`\`
          $FILES
          \`\`\`

          Resolve locally:
          \`\`\`bash
          git fetch upstream main
          git rebase upstream/main
          git rebase --continue
          \`\`\`
          Expect only a handful of lines — the fork's footprint is ~16 lines."
        continue-on-error: true

      - name: Push the rebased branch
        id: pushing
        if: steps.rebase.outputs.ok == 'true'
        run: |
          set -euo pipefail
          # GITHUB_TOKEN may not push changes under .github/workflows/. Upstream touches
          # its own workflows often, so drop those hunks: this fork runs exactly one
          # workflow and does not need upstream's CI definitions to stay in sync.
          if ! git diff --quiet origin/custom-store HEAD -- .github/workflows; then
            echo "::notice::workflow files changed upstream; keeping ours"
            git checkout origin/custom-store -- .github/workflows
            git commit -q -m "ci: keep this fork's workflows when syncing upstream" || true
          fi
          git push --force-with-lease origin HEAD:custom-store
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Record that nothing was pushed
        if: steps.rebase.outputs.ok != 'true'
        run: echo "pushed=false" >> "$GITHUB_OUTPUT"

  build:
    name: Build APK
    needs: sync
    if: needs.sync.outputs.pushed == 'true' || github.event_name == 'workflow_dispatch'
    # Pinned deliberately: ubuntu-26 ships gcc 15, whose
    # -Werror=unterminated-string-initialization rejects upstream's gosys magic strings.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom-store
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.3.13750724" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      # Why this is not a local pack build:
      #
      # AddonPack fetches from Droid-Deck/DroidDeck-Components using a tag derived from the
      # pack's sha256 (pack-<name>-<sha256[0:16]>). Building packs here produces NEW hashes,
      # so the app requests a tag that does not exist upstream, the download 404s, and the
      # runtime install aborts -> the UI bounces back to the storage picker.
      #
      # proot is the pack the Linux runtime actually needs to boot, and upstream pins it in
      # tools/packs/proot/release.env. Use exactly that published artifact so our hash
      # matches a real DroidDeck build.
      - name: Fetch the pinned proot pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . tools/packs/proot/release.env
          TAG="pack-proot-${PROOT_PACK_SHA256:0:16}"
          mkdir -p app/build/packs
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/Droid-Deck/DroidDeck-Components/releases/download/$TAG/proot.tar.zst" \
            -o app/build/packs/proot.tar.zst
          ACTUAL=$(sha256sum app/build/packs/proot.tar.zst | cut -d' ' -f1)
          echo "expected $PROOT_PACK_SHA256"
          echo "actual   $ACTUAL"
          [ "$ACTUAL" = "$PROOT_PACK_SHA256" ] || { echo "::error::proot pack hash mismatch"; exit 1; }
          ls -la app/build/packs/

      # Everything else (GPU driver bundles, Xbox/Ubisoft/Rockstar helpers, ffmpeg-style
      # extras) is optional at runtime. Leaving them out keeps their BuildConfig sha empty,
      # which makes AddonPack report them unavailable instead of failing a download.
      # The store download engines are a Rust crate; cargo-ndk drives the cross-compile.
      - name: Install cargo-ndk
        run: |
          set -euo pipefail
          command -v cargo >/dev/null || rustup default stable
          rustup target add aarch64-linux-android
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

      - name: Tell Gradle which packs we have
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # ciBuild is literally `GITHUB_ACTIONS == true`, and it turns a missing optional pack
      # into a hard failure. Only proot is required at runtime; the rest are extras this
      # fork does not ship, so build in the non-CI path where a missing pack just reports
      # itself unavailable.
      - name: Build APK
        run: |
          unset GITHUB_ACTIONS
          # verifyRuntimeInputs hashes optional GPU/VR assets this fork does not build;
          # it gates packaging but the pieces it checks are extras, not the runtime.
          ./gradlew :app:assembleRelease --no-daemon -x verifyRuntimeInputs

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: droiddeck-custom-store
          path: app/build/outputs/apk/release/*.apk

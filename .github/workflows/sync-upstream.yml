name: Sync upstream and build

# Keeps this fork current with DroidDeck and publishes an APK.
#
# The fork's whole footprint on upstream is ~16 lines, so `git rebase` replays it
# cleanly. On a conflict the branch is left untouched and an issue is opened —
# a broken auto-merge must never ship a bad build.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Sync with upstream
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.pushing.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom-store
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "custom-store bot"
          git config user.email "bot@users.noreply.github.com"
          git remote add upstream https://github.com/Droid-Deck/DroidDeck.git

      - name: Fetch upstream
        id: fetch
        run: |
          set -euo pipefail
          git fetch upstream main
          NEW=$(git rev-parse upstream/main)
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$NEW" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase onto upstream
        id: rebase
        if: steps.fetch.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if git rebase --empty=drop upstream/main; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt || true
            git rebase --abort || true
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue on conflict
        if: steps.rebase.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=$(cat /tmp/conflicts.txt 2>/dev/null || echo '(none reported)')
          gh issue create \
            --title "Upstream sync conflict $(date -u +%Y-%m-%d)" \
            --body "Upstream moved to \`${{ steps.fetch.outputs.new }}\` and the rebase did not apply cleanly.

          The branch was left untouched, so nothing broken was pushed.

          Conflicting files:
          \`\`\`
          $FILES
          \`\`\`

          Resolve locally:
          \`\`\`bash
          git fetch upstream main
          git rebase upstream/main
          git rebase --continue
          \`\`\`
          Expect only a handful of lines — the fork's footprint is ~16 lines."
        continue-on-error: true

      - name: Push the rebased branch
        id: pushing
        if: steps.rebase.outputs.ok == 'true'
        run: |
          set -euo pipefail
          git push --force-with-lease origin HEAD:custom-store
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Record that nothing was pushed
        if: steps.rebase.outputs.ok != 'true'
        run: echo "pushed=false" >> "$GITHUB_OUTPUT"

  build:
    name: Build APK
    needs: sync
    if: needs.sync.outputs.pushed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom-store
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.3.13750724" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      # Native components upstream builds before packaging. Without proot the pack
      # step fails on a missing libproot.so, so this order matters.
      - name: Prepare Linux build tools
        env:
          COMPONENTS_TO_BUILD: "runtime arm64-preloads vkbridge"
        run: python3 tools/components/prepare.py tools

      - name: Build remaining runtime assets
        run: python3 tools/components/prepare.py runtime

      - name: Build Mali bridge
        run: python3 tools/components/prepare.py vkbridge

      - name: Build proot
        run: python3 tools/components/prepare.py proot

      - name: Bundle esync packs
        run: python3 tools/components/prepare.py esync

      - name: Fetch DirectAudio
        run: python3 tools/components/prepare.py directaudio

      - name: Fetch PulseAudio source
        run: python3 tools/components/prepare.py pulseaudio-source

      - name: Build the AAudio sink
        run: python3 tools/components/prepare.py audio

      # aarch64 cross toolchain: the Rust helpers (comet) link against it.
      - name: Install aarch64 cross toolchain
        run: bash tools/ci/install-ubuntu-packages.sh gcc-aarch64-linux-gnu libvulkan-dev

      - name: Build the GOG comet helper
        run: python3 tools/components/prepare.py comet

      # The Xbox helper is an ARM64 Rust build the pack step insists on. It has nothing to
      # do with the custom store, and building it needs an ARM runner, so pull the binary
      # upstream already publishes instead of rebuilding it.
      - name: Fetch the Xbox backend from upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEST=app/src/main/assets/linuxfs/usr/local/lib/droiddeck-xbox
          mkdir -p "$DEST"
          ID=$(gh api "repos/Droid-Deck/DroidDeck/actions/artifacts?name=xbox-arm64&per_page=20" \
                --jq '[.artifacts[] | select(.expired==false)][0].id')
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "::error::no upstream xbox-arm64 artifact available"
            exit 1
          fi
          gh api "repos/Droid-Deck/DroidDeck/actions/artifacts/$ID/zip" > /tmp/xbox.zip
          unzip -q -o /tmp/xbox.zip -d /tmp/xbox
          cp -a /tmp/xbox/. "$DEST"/
          ls -la "$DEST" | head

      # Windows-side helpers the packs ship. Cross-compiled with mingw, same as upstream.
      - name: Build the Ubisoft launcher service
        run: |
          set -euo pipefail
          command -v x86_64-w64-mingw32-gcc >/dev/null || {
            sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64
          }
          bash tools/ubisoft-launcher/build.sh

      - name: Build the Rockstar launcher services
        run: |
          set -euo pipefail
          command -v i686-w64-mingw32-gcc >/dev/null || {
            sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-i686
          }
          bash tools/rockstar-launcher/build.sh

      - name: Build the Dirt ws2_32 shim
        run: python3 tools/components/prepare.py dirt-ws2

      - name: Fetch PowerVR pack input
        run: python3 tools/powervr/fetch.py

      - name: Build the add-on packs
        run: bash tools/packs/build.sh app/build/packs

      # The store download engines are a Rust crate built through cargo-ndk.
      - name: Install cargo-ndk
        run: |
          set -euo pipefail
          command -v cargo >/dev/null || rustup default stable
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
          cargo ndk --version

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: droiddeck-custom-store
          path: app/build/outputs/apk/release/*.apk
